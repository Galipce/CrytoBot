# CrytoBot haber toplama ayarı örneği (spec 0046). Kopyala: crytobot-news.toml (çalışma dizininde,
# git'e girmez). Botun ayarından (crytobot.toml) ayrıdır: bot bu dosyayı okumaz.
# `python -m crytobot news` durdurulana kadar turlar atar; `python -m crytobot news status` ağa
# çıkmadan durumu gösterir. Telegram bildirimi crytobot.toml'daki [reporting.telegram] ayarıyladır.
# Haber metni güvenilmeyen girdidir: yalnız saklanır, çalıştırılmaz; bağlantılar izlenmez.

[news]
store_path = "crytobot-news.db"   # haber kaydı (kendi SQLite deposu); bot deposu olamaz
log_path = "crytobot-news.log"    # kayıt dosyası; bot kaydından ayrı, yalnız sona eklenir, UTF-8
interval_minutes = 15             # iki turun başlangıcı arası, dakika; en az 5
max_response_kb = 2048            # bir kaynağın yanıtı en çok bu kadar KB (1 KB = 1024 bayt)
source_alert_hours = 6            # bu süreden uzun aralıksız hata veren kaynak için tek bildirim

# Geçmiş Binance duyuru arşivi (spec 0047): `python -m crytobot news archive` bütün katalogları en
# eski duyuruya kadar okur, yeniden çalıştırılınca yalnız eksikleri ekler, yarıda kalırsa kaldığı
# sayfadan sürer; `python -m crytobot news archive status` ağa çıkmadan durumu gösterir. Kataloglar
# yanıttan okunur (ayarda liste yok). Arşiv ileriye dönük kayıttan ayrıdır: kayıtları "arşivden"
# işaretlidir, ilk görme anı taşımaz. Yanıt sınırı max_response_kb'dır. Telegram bildirimi gitmez.
archive_store_path = "crytobot-news-archive.db"  # arşiv deposu; haber kaydı ya da bot deposu olamaz
archive_log_path = "crytobot-news-archive.log"   # arşivin kayıt dosyası; diğer kayıtlardan ayrı
archive_url = "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query"  # yalnız https
archive_request_gap_s = 1                         # iki istek arası en az saniye (tamsayı, en az 1)

# Kaynaklar: `type` "binance-duyuru" (JSON) ya da "rss" (RSS 2.0 ve Atom); yalnız https.
# `enabled = false` olan kaynak sorgulanmaz. Kaynak çıkarılınca eski kayıtları kalır.
# Binance duyuru ucu belgelenmiş değildir ve değişebilir: değişirse kaynak hatası olur.
[[news.sources]]
name = "binance-duyuru"
type = "binance-duyuru"
url = "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=20"

[[news.sources]]
name = "coindesk"
type = "rss"
url = "https://www.coindesk.com/arc/outboundfeeds/rss"

[[news.sources]]
name = "cointelegraph"
type = "rss"
url = "https://cointelegraph.com/rss"
enabled = true
