name: check
# The one full run of a spec: the pull request opened at ship (docs/testing.md, Two speeds, rule 10).
# Branch pushes and merges to main run nothing; workflow_dispatch is the manual rerun.
on:
  pull_request:
  workflow_dispatch:

# Least privilege: no job writes to the repository (review 0001, L-2).
permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # doctor diffs specs/done/ against the PR's merge-base; a shallow clone has no base
      - name: Workspace health (spec/plan gates are failures in CI)
        run: ./scripts/doctor --strict
      - name: Self-test (scripts/check, doctor and residue behave as documented)
        run: ./scripts/selftest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Toolchain for scripts/check.conf: uv (pinned by commit SHA), which installs Python 3.12
      # from .python-version and the locked dev tools (spec 0001, AC-1/AC-9).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.6"
      - name: Install locked environment
        run: uv sync --locked
      # --fast is for the inner loop only; CI always runs the full contract (docs/testing.md).
      - name: Verification contract
        run: |
          if [ -f scripts/check.conf ]; then
            ./scripts/check
          else
            echo "scripts/check.conf not present yet (pre-bootstrap) — skipping."
          fi

  # Dependency vulnerability scan (docs/security.md, Dependencies). Needs the network, so it runs
  # here and never inside scripts/check. pip-audit is a CI tool, not a locked project dependency.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.6"
      - name: Export locked requirements (with hashes)
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit
        run: uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"
