# scripts/check.conf — CrytoBot (Python 3.12, uv). Generated by bootstrap 2026-10-29; steps enabled by spec 0001.
# One step per line:  <name>: <command>   — runs in order, fails fast. [fast] in the NAME = fast profile.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
#   uv      — run-once, no daemon/server.            ruff — run-once, no daemon.
#   mypy    — run-once; never dmypy (daemon).        import-linter — run-once.
#   pytest  — single process: no pytest-xdist workers, no watch mode; no cache dir (-p no:cacheprovider).
#   No containers, no app-under-test, no browser (CLI + Telegram, no e2e).
