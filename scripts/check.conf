# resource hygiene: uv run is one-shot (no daemon); --locked = fail on a stale lock, never rewrite it
lint [fast]: uv run --locked ruff check .
format [fast]: uv run --locked ruff format --check .
# resource hygiene: plain mypy, never dmypy (no daemon)
types [fast]: uv run --locked mypy src tests tools
boundaries [fast]: uv run --locked lint-imports
# resource hygiene: single-process pytest (no xdist workers); selector split, never a list (Two speeds rule 4)
test-unit [fast]: uv run --locked pytest -q -p no:cacheprovider -m "not slow"
# pytest exits 5 when the selector matches no tests: only 5 is mapped to green, every other code is kept
test-slow: sh -c 'uv run --locked pytest -q -p no:cacheprovider -m slow; rc=$?; [ "$rc" -eq 5 ] && exit 0; exit "$rc"'
