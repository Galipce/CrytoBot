# scripts/check.conf — CrytoBot (Python 3.12, uv). Generated by bootstrap 2026-10-29; steps enabled by spec 0001.
# One step per line:  <name>: <command>   — runs in order, fails fast. [fast] in the NAME = fast profile.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
#   uv      — run-once, no daemon/server.            ruff — run-once, no daemon.
#   mypy    — run-once; never dmypy (daemon).        import-linter — run-once.
#   pytest  — single process: no pytest-xdist workers, no watch mode; no cache dir (-p no:cacheprovider).
#   coverage data (.coverage, gitignored) — test-unit always starts it fresh (no --cov-append), so a
#             run killed halfway never leaks data into the next run (rule 5).
#   No containers, no app-under-test, no browser (CLI + Telegram, no e2e).
#
# resource hygiene: uv run is one-shot (no daemon); --locked = fail on a stale lock, never rewrite it
lint [fast]: uv run --locked ruff check .
format [fast]: uv run --locked ruff format --check .
# resource hygiene: plain mypy, never dmypy (no daemon)
types [fast]: uv run --locked mypy src tests tools
# resource hygiene: --no-cache = no .import_linter_cache left in the tree between runs
boundaries [fast]: uv run --locked lint-imports --no-cache
# resource hygiene: single-process pytest (no xdist workers); selector split, never a list (Two speeds rule 4)
# Tests only collect coverage (--cov-fail-under=0); the full-only `coverage` step enforces the gate.
test-unit [fast]: uv run --locked pytest -q -p no:cacheprovider -m "not slow" --cov --cov-report= --cov-fail-under=0
# pytest exits 5 when the selector matches no tests: only 5 is mapped to green, every other code is kept
test-slow: sh -c 'uv run --locked pytest -q -p no:cacheprovider -m slow --cov --cov-append --cov-report= --cov-fail-under=0; rc=$?; [ "$rc" -eq 5 ] && exit 0; exit "$rc"'
# coverage gate: EACH of risk, execution, portfolio >= 90% branch (pyproject [tool.coverage.*]; spec 0001 R-6).
# Per module, never the total: a well-tested module must not hide an untested one. First failure's code is kept.
coverage: sh -c 'for m in risk execution portfolio; do uv run --locked coverage report --include="*/crytobot/$m/*" || exit $?; done'
