# CrytoBot ayar dosyası örneği (spec 0022). Kopyala: crytobot.toml (çalışma dizininde, git'e girmez).
# Hiçbir ayarın varsayılanı yoktur: her anahtar zorunludur, bilinmeyen anahtar reddedilir.
# [history] bölümünü bot okumaz; içini `python -m crytobot download` denetler (spec 0023).
# [backtest] bölümünü de bot okumaz; içini `python -m crytobot backtest` denetler (spec 0025).
# Para ve oranlar metin olarak yazılır ("0.01" = %1); ondalık sayı (0.01) kabul edilmez.
# Süreler saniyedir. Aralıklar Binance metnidir: 1m 3m 5m 15m 30m 1h 2h 4h 6h 8h 12h 1d.
# API anahtarı yoktur ve okunmaz: bot yalnız paper modda çalışır.
# Bu değerler örnektir; kârlılıkları kanıtsızdır (BR-10).

[bot]
store_path = "crytobot.db"     # paper deposu; yalnız `python -m crytobot prepare` oluşturur
log_path = "crytobot.log"      # kayıt dosyası; yalnız sona eklenir, UTF-8
turn_interval = "1h"           # iki turun başlangıcı arası; mum aralığından kısa olamaz
opening_balance = "10000"      # hazırlıkta deftere yazılan açılış bakiyesi, USDT

[market]
exchange = "binance"
candle_interval = "1h"
candle_count = 200             # 1..1000
call_timeout = 10              # tek borsa çağrısının süresi, saniye
read_budget = 60               # bir okumanın toplam süresi; tur aralığından kısa olmalı

[turn]
whitelist = ["BTC/USDT", "ETH/USDT"]
fee = "0.001"
slippage = "0.001"
max_candle_age = 900           # son kapanmış mumun en büyük yaşı, saniye
max_price_age = 120            # son fiyatın en büyük yaşı, saniye

[risk]
per_trade_risk = "0.01"
daily_loss_limit = "0.03"
max_drawdown = "0.15"
max_open_positions = 5
profit_cost_multiple = "2"

[strategy]
fast_period = 12
slow_period = 26
rsi_period = 14
rsi_threshold = "70"
atr_period = 14
k = "2"
r = "2"

# Backtest (`python -m crytobot backtest`, spec 0025): indirilen veri dosyasıyla, ağa çıkmadan,
# dönemin her tur anında paper turunun aynısı simüle saatle atılır; rapor konsola ve rapor
# dosyasına yazılır. Strateji, risk, çiftler, aralıklar ve açılış kasası yukarıdaki ayarlardır;
# tur aralığı mum aralığının katı olmalıdır. Var olan rapor dosyasının üzerine yazılmaz.
# Ayarların varsayılanı yoktur: koşmadan önce aşağıdaki satırların başındaki "# " kaldırılır.
# [backtest]
# data_path = "crytobot-history.jsonl"   # `download`'un yazdığı veri dosyası
# report_path = "crytobot-backtest.txt"  # rapor dosyası; veri, depo ve kayıt yolu olamaz
# split_at = 2025-11-22T00:00:00Z         # örneklem içi / dışı ayrımı, UTC, dönemin içinde
# spread = "0.0005"                      # sabit spread (oran); yalnız maliyet kapısında

# Aşama onayı (spec 0028, BR-10): paper botunun kanıtlı modda başlatılması için geçerli bir
# backtest raporu ve insan onayı gerekir. Onay ayarları yapılmadan `crytobot start` çalıştırılamaz
# (deneme modu için `crytobot start --trial` kullanılır).
# Ayarların varsayılanı yoktur: kanıtlı başlatmadan önce aşağıdaki satırların başındaki "# " kaldırılır.
# [stage]
# report_path = "crytobot-backtest.txt"  # geçerli ve aday işareti taşıyan backtest rapor dosyası
# approved_by = "Ad Soyad"              # onayı veren kişinin adı / kimliği
# approved_at = 2026-11-08T12:00:00Z    # onay anı, UTC ISO formatında
# min_trades = 10                       # asgari işlem sayısı (isteğe bağlı, varsayılan 10)
# min_profit_factor = "1.5"             # asgari kâr faktörü (isteğe bağlı, ≥1)

# Geçmiş veri indirme (`python -m crytobot download`, spec 0023): beyaz listedeki çiftlerin kapanmış
# mumları, ısınma için `candle_count` kadar önceki mumlarla, herkese açık veriden anahtarsız indirilir.
# Mum aralığı, çiftler ve çağrı süresi yukarıdaki ayarlardır. Var olan dosyanın üzerine yazılmaz.
# Dönemin varsayılanı yoktur: indirmeden önce aşağıdaki satırların başındaki "# " kaldırılır.
# [history]
# data_path = "crytobot-history.jsonl"   # veri dosyası; deponun ve kayıt dosyasının yolu olamaz
# start = 2025-11-01T00:00:00Z           # dönem başı, UTC, tur aralığı sınırında
# end = 2025-12-01T00:00:00Z             # dönem sonu (hariç); başlangıçtan sonra, indirme anından önce
