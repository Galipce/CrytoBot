[project]
name = "crytobot"
version = "0.1.0"
description = "Kişisel, spot-only kripto alım-satım botu (haber, whitepaper, teknik analiz; risk onaylı emirler)."
requires-python = "==3.12.*"
dependencies = [
    "ccxt>=4.5,<5",
    "websocket-client>=1.8,<2",
]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "import-linter>=2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Turkish prose in docstrings/comments (docs language = tr): dotless ı is a letter, not a confusable
allowed-confusables = ["ı"]

[tool.mypy]
strict = true
python_version = "3.12"

# ccxt is an external library reached only by market_data/_client.py: its code is not type-checked here
[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Forbidden dependencies (docs/architecture.md; spec 0001 R-3). Direct imports only: the documented rule
# is "never imports", and the legitimate strategy -> risk -> execution flow must not count (plan 0001, risk 1).
[tool.importlinter]
root_package = "crytobot"
contract_types = ["no_foreign_submodule_imports: tools.import_contracts.NoForeignSubmoduleImportsContract"]

[[tool.importlinter.contracts]]
name = "R-3a: strategy, analysis, news, research, llm never import execution"
type = "forbidden"
source_modules = [
    "crytobot.strategy", "crytobot.analysis", "crytobot.news", "crytobot.research", "crytobot.llm",
    "crytobot.calibration",  # spec 0045
    "crytobot.decide",  # spec 0059
]
forbidden_modules = ["crytobot.execution"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R-3b: only risk, app, backtest and persistence import execution"
type = "forbidden"
source_modules = [
    "crytobot.market_data", "crytobot.news", "crytobot.research", "crytobot.llm", "crytobot.analysis",
    "crytobot.strategy", "crytobot.portfolio", "crytobot.control", "crytobot.reporting", "crytobot.dashboard",
    "crytobot.calibration",  # spec 0045
    "crytobot.decide",  # spec 0059
    # the entry point only wires real effects: the paper simulator comes from app (spec 0022)
    "crytobot.__main__",
]
forbidden_modules = ["crytobot.execution"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R-3c: analysis imports no other project module"
type = "forbidden"
source_modules = ["crytobot.analysis"]
forbidden_modules = [
    "crytobot.market_data", "crytobot.news", "crytobot.research", "crytobot.llm", "crytobot.strategy",
    "crytobot.risk", "crytobot.execution", "crytobot.portfolio", "crytobot.backtest", "crytobot.control",
    "crytobot.reporting", "crytobot.app", "crytobot.persistence", "crytobot.dashboard",
    "crytobot.calibration",  # spec 0045
    "crytobot.decide",  # spec 0059
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R-3e: only app imports persistence"
type = "forbidden"
source_modules = [
    "crytobot.market_data", "crytobot.news", "crytobot.research", "crytobot.llm", "crytobot.analysis",
    "crytobot.strategy", "crytobot.risk", "crytobot.execution", "crytobot.portfolio", "crytobot.backtest",
    "crytobot.control", "crytobot.reporting", "crytobot.dashboard", "crytobot.calibration",
    "crytobot.decide",  # spec 0059
    # the store is reached only through app's gates (spec 0022)
    "crytobot.__main__",
]
forbidden_modules = ["crytobot.persistence"]
allow_indirect_imports = true

# Spec 0025 (plan A-1): the backtest's results never reach back into the run or the reader. ccxt is
# covered for the whole src by tests/market_data/test_ccxt_boundary.py (no include_external_packages).
[[tool.importlinter.contracts]]
name = "R-3f: backtest imports neither app nor market_data"
type = "forbidden"
source_modules = ["crytobot.backtest"]
forbidden_modules = ["crytobot.app", "crytobot.market_data"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R-3g: dashboard never imports control or execution"
type = "forbidden"
source_modules = ["crytobot.dashboard"]
forbidden_modules = ["crytobot.control", "crytobot.execution"]
allow_indirect_imports = true

# Spec 0045 (plan Risk 2): the calibration is a pure leaf on top of analysis; data, files and the
# clock are wired in app and the entry point.
[[tool.importlinter.contracts]]
name = "R-3h: calibration imports no project module but analysis"
type = "forbidden"
source_modules = ["crytobot.calibration"]
forbidden_modules = [
    "crytobot.market_data", "crytobot.news", "crytobot.research", "crytobot.llm", "crytobot.strategy",
    "crytobot.risk", "crytobot.execution", "crytobot.portfolio", "crytobot.backtest", "crytobot.control",
    "crytobot.reporting", "crytobot.app", "crytobot.persistence", "crytobot.dashboard",
    "crytobot.decide",  # spec 0059
]
allow_indirect_imports = true

# Spec 0046 (plan Risk 1, A-1): news collection runs outside the trading loop; the entry point
# wires its real effects, `app` does not mediate.
[[tool.importlinter.contracts]]
name = "R-3i: news imports no trading module"
type = "forbidden"
source_modules = ["crytobot.news"]
forbidden_modules = [
    "crytobot.app", "crytobot.persistence", "crytobot.execution", "crytobot.portfolio",
    "crytobot.risk", "crytobot.strategy", "crytobot.backtest", "crytobot.control",
    "crytobot.dashboard", "crytobot.market_data",
]
allow_indirect_imports = true

# Spec 0051 (plan step 1): `llm` is the `claude -p` subprocess only; it reads no project data and
# never decides. The scorer in `news` does not import it either: the entry point passes the call in.
[[tool.importlinter.contracts]]
name = "R-3j: llm imports no project module"
type = "forbidden"
source_modules = ["crytobot.llm"]
forbidden_modules = [
    "crytobot.market_data", "crytobot.news", "crytobot.research", "crytobot.analysis",
    "crytobot.strategy", "crytobot.risk", "crytobot.execution", "crytobot.portfolio",
    "crytobot.backtest", "crytobot.control", "crytobot.reporting", "crytobot.app",
    "crytobot.persistence", "crytobot.dashboard", "crytobot.calibration",
    "crytobot.decide",  # spec 0059
]
allow_indirect_imports = true

# Spec 0052 (plan Risk 4): the paper turn cannot reach the scores structurally; the entry point
# reads the score and news records and hands the bot a view in `app`'s own type.
[[tool.importlinter.contracts]]
name = "R-3k: app imports neither news nor llm"
type = "forbidden"
source_modules = ["crytobot.app"]
# spec 0059: the bot never reads the LLM decision record either (ADR 0005)
forbidden_modules = ["crytobot.news", "crytobot.llm", "crytobot.decide"]
allow_indirect_imports = true

# Spec 0059 (plan Risk 1): the decision turn is a pure core; market data, scores, the Claude call
# and the notice are wired in by the entry point. Its decisions feed no ledger, bot or filter.
[[tool.importlinter.contracts]]
name = "R-3l: decide imports no trading, data, news or llm module"
type = "forbidden"
source_modules = ["crytobot.decide"]
forbidden_modules = [
    "crytobot.app", "crytobot.persistence", "crytobot.execution", "crytobot.portfolio",
    "crytobot.risk", "crytobot.strategy", "crytobot.backtest", "crytobot.control",
    "crytobot.dashboard", "crytobot.market_data", "crytobot.news", "crytobot.llm",
    "crytobot.research", "crytobot.reporting", "crytobot.calibration",
]
allow_indirect_imports = true

# Spec 0059 AC-9 (review round 1 M-1): the bot, the ledgers and the paper path cannot reach the
# decision record, not even through another module; only the entry point wires `decide`.
[[tool.importlinter.contracts]]
name = "R-3m: no trading module reaches decide"
type = "forbidden"
source_modules = [
    "crytobot.app", "crytobot.persistence", "crytobot.execution", "crytobot.portfolio",
    "crytobot.risk", "crytobot.strategy", "crytobot.backtest", "crytobot.control",
    "crytobot.dashboard", "crytobot.reporting",
]
forbidden_modules = ["crytobot.decide"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "R-3d: no module imports another module's internal submodules"
type = "no_foreign_submodule_imports"
root_package = "crytobot"

# Coverage gate (spec 0001 R-6): measured for the sensitive modules only; enforced by the full-only
# `coverage` step in scripts/check.conf (fail_under below).
[tool.coverage.run]
branch = true
source_pkgs = ["crytobot.risk", "crytobot.execution", "crytobot.portfolio", "crytobot.persistence", "crytobot.app"]
# test-slow (tooling tests in subprocesses) appends to test-unit's data without importing these packages
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-only tests (check step test-slow; docs/testing.md, Two speeds)"]
# --disable-socket: tests never reach the network (docs/testing.md; spec 0001 R-5)
addopts = ["--strict-markers", "--disable-socket"]
